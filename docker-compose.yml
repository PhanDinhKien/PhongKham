services:
  # SQL Server 2022 chạy trong container Linux
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sale-sqlserver
    environment:
      ACCEPT_EULA: "Y"                         # bắt buộc: đồng ý điều khoản của Microsoft
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}  # đọc từ file .env
      MSSQL_PID: "Developer"                   # bản Developer: miễn phí cho học tập/phát triển
    ports:
      - "1433:1433"                            # cổng máy thật : cổng trong container
    volumes:
      - sqlserver-data:/var/opt/mssql          # giữ dữ liệu khi xóa/tạo lại container
    healthcheck:                               # kiểm tra SQL Server đã sẵn sàng nhận kết nối chưa
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Container chạy một lần: tạo database khi SQL Server đã sẵn sàng, xong thì tự thoát
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME}
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C
      -Q \"IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME];\"
      && echo 'Database $$DB_NAME san sang'"
    restart: "no"

volumes:
  sqlserver-data:
