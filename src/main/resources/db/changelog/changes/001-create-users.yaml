databaseChangeLog:
- changeSet:
    id: 001-create-users
    author: phankien
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: usersPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: active
            type: BOOLEAN
        - column:
            constraints:
              nullable: false
            name: email
            type: VARCHAR(100)
        - column:
            constraints:
              nullable: false
            name: name
            type: NVARCHAR(250)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        - column:
            constraints:
              nullable: false
            name: updated_at
            type: datetime2
        tableName: users
- changeSet:
    id: 001-users-unique-email
    author: phankien
    changes:
    - addUniqueConstraint:
        columnNames: email
        constraintName: UC_USERSEMAIL_COL
        tableName: users

