databaseChangeLog:
- changeSet:
    id: 009-create-medical-services
    author: phankien
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: medicalServicesPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: code
            type: varchar(50)
        - column:
            constraints:
              nullable: false
            name: name
            type: nvarchar(255)
        - column:
            constraints:
              nullable: false
            name: price
            type: decimal(18, 2)
            defaultValueNumeric: 0
        - column:
            constraints:
              nullable: false
            name: service_type
            type: varchar(50)
        - column:
            constraints:
              nullable: false
            name: active
            type: bit
            defaultValueBoolean: true
        - column:
            name: description
            type: nvarchar(500)
        - column:
            constraints:
              nullable: false
            name: is_deleted
            type: bit
            defaultValueBoolean: false
        - column:
            name: deleted_at
            type: datetime2
        - column:
            name: deleted_by
            type: nvarchar(100)
        - column:
            name: created_by
            type: nvarchar(100)
        - column:
            name: updated_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        - column:
            constraints:
              nullable: false
            name: updated_at
            type: datetime2
        tableName: medical_services
- changeSet:
    id: 009-medical-services-unique-code
    author: phankien
    changes:
    - addUniqueConstraint:
        columnNames: code
        constraintName: UC_MEDICAL_SERVICES_CODE
        tableName: medical_services
