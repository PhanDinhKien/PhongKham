databaseChangeLog:
  - changeSet:
      id: 019-create-receipts
      author: kienpd
      changes:
        - createTable:
            tableName: receipts
            columns:
              - column:
                  name: id
                  type: uniqueidentifier
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: receipt_code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: patient_id
                  type: uniqueidentifier
              - column:
                  name: patient_code
                  type: varchar(50)
              - column:
                  name: record_code
                  type: varchar(50)
              - column:
                  name: patient_name
                  type: nvarchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: varchar(20)
              - column:
                  name: birth_year
                  type: varchar(20)
              - column:
                  name: contract_id
                  type: uniqueidentifier
              - column:
                  name: company_code
                  type: varchar(50)
              - column:
                  name: company_name
                  type: nvarchar(255)
              - column:
                  name: contract_code
                  type: varchar(50)
              - column:
                  name: contract_name
                  type: nvarchar(255)
              - column:
                  name: package_name
                  type: nvarchar(255)
              - column:
                  name: lab_services
                  type: nvarchar(max)
              - column:
                  name: imaging_services
                  type: nvarchar(max)
              - column:
                  name: all_services_json
                  type: nvarchar(max)
              - column:
                  name: subtotal
                  type: decimal(18,2)
              - column:
                  name: discount_code
                  type: varchar(50)
              - column:
                  name: discount_percent
                  type: decimal(5,2)
              - column:
                  name: discount_amount
                  type: decimal(18,2)
              - column:
                  name: final_amount
                  type: decimal(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: customer_paid
                  type: decimal(18,2)
              - column:
                  name: change_amount
                  type: decimal(18,2)
              - column:
                  name: payment_method
                  type: varchar(50)
              - column:
                  name: cashier_name
                  type: nvarchar(100)
              - column:
                  name: note
                  type: nvarchar(500)
              - column:
                  name: print_status
                  type: varchar(30)
                  defaultValue: "DA_IN"
              - column:
                  name: sync_status
                  type: varchar(30)
                  defaultValue: "DA_DONG_BO"
              - column:
                  name: created_by
                  type: nvarchar(100)
              - column:
                  name: created_at
                  type: datetime2
              - column:
                  name: updated_at
                  type: datetime2
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
