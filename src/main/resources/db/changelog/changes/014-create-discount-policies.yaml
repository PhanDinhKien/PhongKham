databaseChangeLog:
- changeSet:
    id: 014-create-discount-policies
    author: phankien
    changes:
    # 1. Bảng chính sách giảm giá
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: discountPoliciesPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
              unique: true
              uniqueConstraintName: UC_DISCOUNT_POLICY_CODE
            name: code
            type: varchar(50)
        - column:
            constraints:
              nullable: false
            name: name
            type: nvarchar(255)
        - column:
            constraints:
              nullable: false
            name: apply_type
            type: varchar(50)
            defaultValue: HOP_DONG
        - column:
            constraints:
              nullable: false
            name: discount_type
            type: varchar(50)
            defaultValue: PERCENT
        - column:
            constraints:
              nullable: false
            name: tier_scope
            type: varchar(50)
            defaultValue: MAX_TIER_ALL
        - column:
            name: max_discount_per_service
            type: decimal(18,2)
        - column:
            constraints:
              nullable: false
            name: start_date
            type: date
        - column:
            name: end_date
            type: date
        - column:
            constraints:
              nullable: false
            name: active
            type: bit
            defaultValueBoolean: true
        - column:
            name: created_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        - column:
            name: updated_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: updated_at
            type: datetime2
        - column:
            constraints:
              nullable: false
            name: is_deleted
            type: bit
            defaultValueBoolean: false
        - column:
            name: deleted_by
            type: nvarchar(100)
        - column:
            name: deleted_at
            type: datetime2
        tableName: discount_policies

    # 2. Bảng liên kết Chính sách - Hợp đồng (Một chính sách có 1 hoặc nhiều hợp đồng)
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: discountPolicyContractsPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: policy_id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: contract_id
            type: uniqueidentifier
        - column:
            name: created_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        tableName: discount_policy_contracts

    # 3. Bảng các bậc chiết khấu theo số lượng dịch vụ
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: discountPolicyTiersPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: policy_id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: tier_number
            type: int
        - column:
            constraints:
              nullable: false
            name: from_quantity
            type: int
        - column:
            name: to_quantity
            type: int
        - column:
            constraints:
              nullable: false
            name: discount_value
            type: decimal(18,2)
        - column:
            name: created_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        tableName: discount_policy_tiers

    # 4. Ràng buộc khóa ngoại
    - addForeignKeyConstraint:
        baseColumnNames: policy_id
        baseTableName: discount_policy_contracts
        constraintName: FK_DPC_POLICY
        referencedColumnNames: id
        referencedTableName: discount_policies
    - addForeignKeyConstraint:
        baseColumnNames: contract_id
        baseTableName: discount_policy_contracts
        constraintName: FK_DPC_CONTRACT
        referencedColumnNames: id
        referencedTableName: contracts
    - addUniqueConstraint:
        columnNames: policy_id, contract_id
        constraintName: UC_DISCOUNT_POLICY_CONTRACT
        tableName: discount_policy_contracts

    - addForeignKeyConstraint:
        baseColumnNames: policy_id
        baseTableName: discount_policy_tiers
        constraintName: FK_DPT_POLICY
        referencedColumnNames: id
        referencedTableName: discount_policies
