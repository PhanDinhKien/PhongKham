databaseChangeLog:
- changeSet:
    id: 016-create-service-quotas
    author: phankien
    changes:
    # Bảng cấu hình định mức dịch vụ theo địa điểm khám
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: serviceQuotasPK
            name: id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: service_id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: location_id
            type: uniqueidentifier
        - column:
            constraints:
              nullable: false
            name: apply_type
            type: varchar(50)
            defaultValue: THEO_CA
        - column:
            constraints:
              nullable: false
            name: max_quantity
            type: int
            defaultValueNumeric: 0
        - column:
            name: shift1_quantity
            type: int
            defaultValueNumeric: 0
        - column:
            name: shift2_quantity
            type: int
            defaultValueNumeric: 0
        - column:
            name: valid_from
            type: date
        - column:
            name: valid_to
            type: date
        - column:
            constraints:
              nullable: false
            name: active
            type: bit
            defaultValueBoolean: true
        - column:
            name: created_by
            type: nvarchar(100)
        - column:
            name: updated_by
            type: nvarchar(100)
        - column:
            constraints:
              nullable: false
            name: created_at
            type: datetime2
        - column:
            name: updated_at
            type: datetime2
        tableName: service_quotas

    - addForeignKeyConstraint:
        baseColumnNames: service_id
        baseTableName: service_quotas
        constraintName: FK_SERVICE_QUOTAS_SERVICE
        referencedColumnNames: id
        referencedTableName: medical_services
        onDelete: CASCADE

    - addForeignKeyConstraint:
        baseColumnNames: location_id
        baseTableName: service_quotas
        constraintName: FK_SERVICE_QUOTAS_LOCATION
        referencedColumnNames: id
        referencedTableName: locations
        onDelete: CASCADE
