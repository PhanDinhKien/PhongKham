databaseChangeLog:
- changeSet:
    id: 003-add-failed-login-count
    author: phankien
    changes:
    - addColumn:
        columns:
        - column:
            name: failed_login_count
            type: int
        tableName: users
- changeSet:
    id: 003-add-last-login-at
    author: phankien
    changes:
    - addColumn:
        columns:
        - column:
            name: last_login_at
            type: datetime2
        tableName: users
- changeSet:
    id: 003-add-locked-until
    author: phankien
    changes:
    - addColumn:
        columns:
        - column:
            name: locked_until
            type: datetime2
        tableName: users
- changeSet:
    id: 003-add-password-hash
    author: phankien
    changes:
    - addColumn:
        columns:
        - column:
            constraints:
              nullable: false
            name: password_hash
            type: varchar(255)
        tableName: users

