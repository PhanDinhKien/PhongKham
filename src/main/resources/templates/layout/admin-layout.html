<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
    <th:block th:fragment="common-head(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title != null ? title + ' | Mirai Healthcare' : 'Mirai Healthcare Admin'}">Mirai Healthcare Admin</title>
        
        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        
        <!-- Phosphor Icons -->
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"/>

        <!-- Admin Core CSS -->
        <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
    </th:block>
</head>
<body>

    <!-- ==============================================================
         FRAGMENT: SIDEBAR BÊN TRÁI DÙNG CHUNG CHO TẤT CẢ MÀN HÌNH QUẢN TRỊ
         ============================================================== -->
    <aside class="admin-sidebar" th:fragment="sidebar(activeGroup, activeItem)">
        
        <!-- Nhóm trên: Logo + Menu chính -->
        <div>
            <!-- Header Logo Thương hiệu -->
            <div class="sidebar-header">
                <div class="brand-icon-box">
                    <i class="ph-fill ph-first-aid"></i>
                </div>
                <div class="brand-title-wrap">
                    <span class="brand-title-main">MIRAI</span>
                    <span class="brand-title-sub">Healthcare Systems</span>
                </div>
            </div>

            <!-- Danh sách các phân hệ tính năng -->
            <nav class="sidebar-nav">
                
                <!-- 1. Quản trị hệ thống -->
                <div class="nav-group">
                    <div class="nav-item-parent">
                        <i class="ph ph-gear"></i>
                        <span>Quản trị hệ thống</span>
                    </div>
                    <div class="nav-sub-list">
                        <a th:href="@{/admin/users}" class="nav-sub-item" th:classappend="${activeItem == 'tai-khoan'} ? 'active' : ''">
                            Tài khoản
                        </a>
                        <a th:href="@{/admin/roles}" class="nav-sub-item" th:classappend="${activeItem == 'vai-tro'} ? 'active' : ''">
                            Vai trò & Quyền
                        </a>
                    </div>
                </div>

                <!-- 2. Quản lý khám bệnh -->
                <div class="nav-group">
                    <div class="nav-item-parent">
                        <i class="ph ph-heartbeat"></i>
                        <span>Quản lý khám bệnh</span>
                    </div>
                    <div class="nav-sub-list">
                        <a th:href="@{/admin/patients}" class="nav-sub-item" th:classappend="${activeItem == 'nguoi-benh'} ? 'active' : ''">
                            Hồ sơ người bệnh
                        </a>
                    </div>
                </div>

                <!-- 3. Kinh doanh & Hợp đồng -->
                <div class="nav-group">
                    <div class="nav-item-parent">
                        <i class="ph ph-briefcase"></i>
                        <span>Kinh doanh & Hợp đồng</span>
                    </div>
                    <div class="nav-sub-list">
                        <a th:href="@{/admin/contracts}" class="nav-sub-item" th:classappend="${activeItem == 'hop-dong'} ? 'active' : ''">
                            Quản lý hợp đồng
                        </a>
                        <a th:href="@{/admin/receipts}" class="nav-sub-item" th:classappend="${activeItem == 'phieu-thu'} ? 'active' : ''">
                            Danh sách phiếu thu
                        </a>
                    </div>
                </div>

                <!-- 4. Thiết lập chung -->
                <div class="nav-group">
                    <div class="nav-item-parent">
                        <i class="ph ph-faders"></i>
                        <span>Thiết lập chung</span>
                    </div>
                    <div class="nav-sub-list">
                        <a th:href="@{/admin/locations}" class="nav-sub-item" th:classappend="${activeItem == 'dia-diem'} ? 'active' : ''">
                            Địa điểm khám
                        </a>
                        <a th:href="@{/admin/services}" class="nav-sub-item" th:classappend="${activeItem == 'danh-muc-dich-vu'} ? 'active' : ''">
                            Danh mục dịch vụ
                        </a>
                        <a th:href="@{/admin/service-quotas}" class="nav-sub-item" th:classappend="${activeItem == 'dinh-muc-dich-vu'} ? 'active' : ''">
                            Định mức dịch vụ
                        </a>
                        <a th:href="@{/admin/discounts}" class="nav-sub-item" th:classappend="${activeItem == 'chinh-sach-giam-gia'} ? 'active' : ''">
                            Chính sách giảm giá
                        </a>
                    </div>
                </div>

            </nav>
        </div>

        <!-- Nhóm dưới: Nhật ký hoạt động & Đăng xuất -->
        <div class="sidebar-footer">
            <a th:href="@{/login?logout}" class="footer-nav-item">
                <i class="ph ph-sign-out"></i>
                <span>Đăng xuất</span>
            </a>
        </div>

    </aside>

</body>
</html>
