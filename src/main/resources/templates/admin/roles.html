<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/admin-layout :: common-head('Danh sách vai trò & phân quyền')}"></th:block>
</head>
<body>

    <div class="admin-layout">
        
        <!-- Khung Sidebar dùng chung (Fragment) -->
        <div th:replace="~{layout/admin-layout :: sidebar('quan-tri', 'vai-tro')}"></div>

        <!-- Phân vùng nội dung chính bên phải -->
        <main class="admin-main">
            
            <!-- Breadcrumbs -->
            <div class="breadcrumb-bar">
                <a th:href="@{/admin/dashboard}" class="breadcrumb-link">Trang chủ</a>
                <span class="breadcrumb-separator">›</span>
                <span class="breadcrumb-link">Quản trị hệ thống</span>
                <span class="breadcrumb-separator">›</span>
                <span class="breadcrumb-current">Vai trò & Quyền</span>
            </div>

            <!-- Tiêu đề trang & Nút thêm vai trò -->
            <div class="page-header-row">
                <h1 class="page-title">Danh sách vai trò & phân quyền</h1>
                
                <div class="page-header-actions">
                    <a th:href="@{/admin/roles/create}" href="/admin/roles/create" class="btn-add-account">
                        <i class="ph-bold ph-plus"></i>
                        <span>Thêm vai trò</span>
                    </a>
                </div>
            </div>

            <!-- Thanh công cụ tìm kiếm & Bộ lọc -->
            <div class="filter-toolbar">
                
                <!-- Ô tìm kiếm mã vai trò, tên vai trò -->
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm theo mã vai trò hoặc tên vai trò...">
                </div>

                <!-- Dropdown lọc theo trạng thái -->
                <div class="filter-select-wrap">
                    <select id="statusFilter" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="true">Hoạt động</option>
                        <option value="false">Đã khóa</option>
                    </select>
                    <i class="ph ph-caret-down"></i>
                </div>

                <!-- Nút Xóa bộ lọc -->
                <button type="button" id="btnClearFilter" class="btn-clear-filter">
                    <i class="ph ph-funnel"></i>
                    <span>Xóa bộ lọc</span>
                </button>
            </div>

            <!-- Bảng dữ liệu danh sách vai trò -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px; white-space: nowrap;">STT</th>
                                <th style="width: 160px; white-space: nowrap;">Mã vai trò</th>
                                <th style="width: 200px; white-space: nowrap;">Tên vai trò</th>
                                <th style="white-space: nowrap;">Mô tả</th>
                                <th style="width: 130px; text-align: center; white-space: nowrap;">Số tài khoản</th>
                                <th style="width: 120px; text-align: center; white-space: nowrap;">Quyền hạn</th>
                                <th style="width: 130px; white-space: nowrap;">Trạng thái</th>
                                <th style="width: 160px; text-align: right; padding-right: 20px; white-space: nowrap;">Tác vụ</th>
                            </tr>
                        </thead>
                        <tbody id="roleTableBody">
                            <tr>
                                <td colspan="8" style="text-align: center; padding: 40px; color: var(--slate-400);">
                                    Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang (Pagination Bar) -->
                <div class="pagination-bar">
                    <div class="pagination-info" id="paginationInfo">
                        Đang xem 0 - 0 trong 0
                    </div>

                    <div class="pagination-actions">
                        <div class="pagination-controls" id="paginationControls">
                            <!-- Nút trang được sinh động bởi JS -->
                        </div>

                        <div class="page-size-wrap">
                            <select id="pageSizeSelect" class="page-size-select">
                                <option value="10">10 / trang</option>
                                <option value="20" selected>20 / trang</option>
                                <option value="50">50 / trang</option>
                                <option value="100">100 / trang</option>
                            </select>
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>



    <!-- ==============================================================
         MODAL: XÁC NHẬN XÓA VAI TRÒ
         ============================================================== -->
    <div class="modal-backdrop" id="deleteConfirmModal">
        <div class="modal-dialog" style="max-width: 440px;">
            <div class="modal-header">
                <h3 class="modal-title" style="color: #dc2626;">Xác nhận xóa vai trò</h3>
                <button type="button" class="btn-modal-close" id="btnCloseDeleteModal">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <p style="font-size: 13.5px; color: var(--slate-600); line-height: 1.5;">
                    Bạn có chắc chắn muốn xóa vai trò <strong id="deleteRoleName" style="color: var(--slate-900);"></strong> không?
                </p>
                <div id="deleteWarningBox" style="margin-top: 12px; padding: 10px 14px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; font-size: 12.5px; color: #b91c1c; display: none;">
                    <i class="ph ph-warning-circle" style="font-size: 16px; vertical-align: -2px; margin-right: 4px;"></i>
                    <span id="deleteWarningText"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-cancel" id="btnCancelDeleteModal">Hủy</button>
                <button type="button" class="btn-modal-danger" id="btnConfirmDelete">Xóa vai trò</button>
            </div>
        </div>
    </div>

    <!-- Khung thông báo Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==============================================================
         JAVASCRIPT XỬ LÝ NGHIỆP VỤ QUẢN LÝ VAI TRÒ & QUYỀN
         ============================================================== -->
    <!-- Roles Management Script -->
    <script th:src="@{/js/roles.js}" src="/js/roles.js"></script>
</body>
</html>
