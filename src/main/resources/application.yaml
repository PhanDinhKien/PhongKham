spring:
  application:
    name: sale
    
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SaleDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
   
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml