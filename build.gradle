buildscript {
	repositories { mavenCentral() }
	dependencies { classpath 'org.liquibase:liquibase-core:5.0.3' }
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.liquibase.gradle' version '3.1.0'
}

group = 'mirai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Ứng dụng
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.security:spring-security-crypto' // BCrypt để băm mật khẩu
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

        implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

        // thư viện phục vụ cho việc xác thực hệ thống
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
        

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Chỉ dùng khi chạy lệnh Liquibase (generateChangelog, diffChangelog, rollback...)
	liquibaseRuntime 'org.liquibase:liquibase-core'
	liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate7:5.0.4'
	liquibaseRuntime 'info.picocli:picocli:4.7.7'
	liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
	liquibaseRuntime 'com.microsoft.sqlserver:mssql-jdbc'
	liquibaseRuntime sourceSets.main.output
}

tasks.named('test') {
	useJUnitPlatform()
}

liquibase {
	activities {
		main {
			searchPath 'src/main/resources'
			changelogFile 'db/changelog/db.changelog-master.yml'
			url 'jdbc:sqlserver://localhost:1433;databaseName=SaleDB;encrypt=true;trustServerCertificate=true'
			username 'sa'
			password System.getenv('DB_PASSWORD')
		}
		diff {
			changelogFile project.findProperty('outFile') ?: 'build/diff-changelog.yaml'
			url 'jdbc:sqlserver://localhost:1433;databaseName=SaleDB;encrypt=true;trustServerCertificate=true'
			username 'sa'
			password System.getenv('DB_PASSWORD')
			referenceUrl 'hibernate:spring:mirai.sale.Entity?dialect=org.hibernate.dialect.SQLServerDialect'
			author 'phankien'
		}
	}
	runList = project.findProperty('runList') ?: 'main'
}